async function saveAccount(form,id){const d=formPayload(form);if(d.status==="limited"&&!d.limited_until)return toast("Choose when this account becomes available again","error");const payload={provider:d.provider,label:d.label.trim(),email:d.email.trim()||null,status:d.status,limited_until:d.status==="limited"?new Date(d.limited_until).toISOString():null,notes:d.notes.trim()||null};if(!payload.label)return toast("Account label is required.","error");const old=id?accountById(id):null,item={...old,...payload,id:id||uuid(),user_id:state.user.id,created_at:old?.created_at||new Date().toISOString()};closeModal();const saved=await mutate(()=>replaceById(state.accounts,item),()=>id?supabase.from("accounts").update(payload).eq("id",id).select().single():supabase.from("accounts").insert({id:item.id,...payload}).select().single(),id?"Updating account":"Adding account");if(saved){replaceById(state.accounts,saved);render();toast("Account saved.","success")}}
